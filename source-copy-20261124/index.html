<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'self'; script-src 'sha256-qdMP00X4uG7mW4DahSqE5w1cTekFR5d8NrScmS804QU='; style-src 'sha256-8YdBt7+4bnobhyA62NUGYIp3r1ePL+/mBQXQH70LpK4='">
<title>ソースコードの転記</title>
<style>
:root {
  color-scheme: light;
  font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
  color: #18323d;
  background: #f5f3ed;
  font-size: 100%;
  line-height: 1.55;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
main { width: min(70rem, calc(100% - 2rem)); margin: 3rem auto; }
h1 { margin: 0 0 1.4rem; font-size: clamp(1.6rem, 4vw, 2.35rem); line-height: 1.35; }
h2 { margin: 0 0 .75rem; font-size: 1.125rem; }
p { margin: .6rem 0; }
.panel { border: 1px solid #cbd6d3; border-radius: 12px; padding: clamp(1rem, 3vw, 1.5rem); background: #fff; }
.compact { max-width: 42rem; }
.fields { display: flex; flex-wrap: wrap; align-items: end; gap: .65rem; }
.field { display: grid; gap: .35rem; flex: 1 1 17rem; min-width: min(14rem, 100%); }
label { font-weight: 700; }
input, select, button { font: inherit; min-height: 2.75rem; border-radius: 5px; }
input, select { width: 100%; min-width: 0; border: 1px solid #697f83; background: #fff; color: inherit; padding: .5rem .65rem; }
button { border: 1px solid #00625c; padding: .45rem .85rem; background: #00625c; color: #fff; font-weight: 700; cursor: pointer; }
button:hover { background: #004e49; }
button.secondary { border-color: #697f83; background: #fff; color: #18323d; }
button.secondary:hover { background: #e8f1ef; }
button:disabled { cursor: wait; opacity: .65; }
:where(button, input, select, textarea):focus-visible { outline: 3px solid #9c5200; outline-offset: 3px; }
.muted { color: #4e6267; }
.error { color: #982320; }
.status { min-height: 1.55em; }
.toolbar { display: flex; flex-wrap: wrap; gap: .65rem; align-items: end; }
.toolbar .field { flex-basis: 17rem; }
.file-header { display: flex; align-items: baseline; gap: .5rem 1rem; flex-wrap: wrap; margin: 1rem 0 .45rem; }
.file-header label { overflow-wrap: anywhere; }
.file-header .status { margin: 0; }
textarea, #generated-key { font-family: Consolas, "SFMono-Regular", ui-monospace, monospace; }
textarea { display: block; resize: vertical; min-height: 14rem; height: 58vh; width: 100%; padding: .8rem; color: #152c34; background: #f7faf9; border: 1px solid #697f83; border-radius: 5px; font-size: .875rem; line-height: 1.55; tab-size: 4; }
#prepared { margin-top: 1.25rem; }
#generated-key { margin-block: .35rem .5rem; }
@media (max-width: 580px) {
  main { margin-block: 1.5rem; }
  .field { flex-basis: 100%; }
}
</style>
</head>
<body>
<main>
  <h1>ソースコードの転記</h1>
  <section class="panel compact" id="locked" aria-labelledby="locked-heading">
    <h2 id="locked-heading">復号鍵を入力</h2>
    <form id="unlock-form">
      <div class="fields">
        <div class="field">
          <label for="key">復号鍵</label>
          <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="unlock-status" required>
        </div>
        <button id="unlock" type="submit">復号する</button>
      </div>
      <p id="unlock-status" class="status error" role="status"></p>
    </form>
    <noscript><p>復号するには JavaScript を有効にしてください。</p></noscript>
  </section>
  <section class="panel" id="unlocked" aria-label="復号したソースコード" hidden>
    <p id="bundle-info" class="muted"></p>
    <div class="toolbar">
      <div class="field">
        <label for="files">ファイル</label>
        <select id="files"></select>
      </div>
      <button id="copy" type="button">全文をコピー</button>
      <button id="next" type="button" class="secondary">次のファイル</button>
      <button id="clear" type="button" class="secondary">ロック</button>
    </div>
    <div class="file-header">
      <label for="code" id="path"></label>
      <p id="copy-status" class="status" role="status"></p>
    </div>
    <textarea id="code" wrap="off" readonly spellcheck="false"></textarea>
  </section>
</main>
<script>
"use strict";

const locked = document.getElementById("locked");
const unlocked = document.getElementById("unlocked");
const form = document.getElementById("unlock-form");
const input = document.getElementById("key");
const unlock = document.getElementById("unlock");
const unlockStatus = document.getElementById("unlock-status");
const files = document.getElementById("files");
const info = document.getElementById("bundle-info");
const pathLabel = document.getElementById("path");
const code = document.getElementById("code");
const next = document.getElementById("next");
const copyStatus = document.getElementById("copy-status");
const aad = new TextEncoder().encode("source-copy/v1");
const sourcePath = /^(?:app\.py|lib\/(?:utils\/(?:[A-Za-z0-9_-]+\/)*)?[A-Za-z0-9_-]+\.py)$/;
let sources = [];
let attempt = 0;

function decodeBase64(value) {
  return Uint8Array.from(atob(value), character => character.charCodeAt(0));
}

function renderFile() {
  const source = sources[files.selectedIndex];
  pathLabel.textContent = source.path;
  code.value = source.text;
  code.setSelectionRange(0, 0);
  code.scrollTop = code.scrollLeft = 0;
  next.disabled = files.selectedIndex >= sources.length - 1;
  copyStatus.textContent = "";
}

function lock(restoreFocus = true) {
  attempt += 1;
  sources = [];
  files.replaceChildren();
  info.textContent = pathLabel.textContent = copyStatus.textContent = code.value = input.value = "";
  unlockStatus.textContent = "";
  unlock.disabled = false;
  input.disabled = false;
  unlocked.hidden = true;
  locked.hidden = false;
  if (restoreFocus) input.focus();
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  if (!crypto.subtle) {
    unlockStatus.textContent = "HTTPS でこのページを開いてください。";
    return;
  }
  const entered = input.value.trim();
  if (!/^[A-Za-z0-9_-]{43}$/.test(entered)) {
    unlockStatus.textContent = "復号鍵の43文字を入力してください。";
    input.focus();
    return;
  }
  const token = ++attempt;
  let keyBytes = decodeBase64(entered.replace(/-/g, "+").replace(/_/g, "/") + "=");
  input.value = "";
  input.disabled = unlock.disabled = true;
  unlockStatus.textContent = "暗号化データを読み込んでいます。";
  try {
    const response = await fetch("./payload.json", {
      cache: "no-store", credentials: "omit", redirect: "error",
    });
    if (!response.ok) {
      unlockStatus.textContent = "暗号化データを読み込めません。公開が終了した可能性があります。";
      return;
    }
    const bundle = await response.json();
    if (bundle.version !== 1 || typeof bundle.iv !== "string" || typeof bundle.data !== "string") {
      throw new Error("Invalid bundle");
    }
    const iv = decodeBase64(bundle.iv);
    if (iv.length !== 12) throw new Error("Invalid nonce");
    const key = await crypto.subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]);
    keyBytes.fill(0);
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv, additionalData: aad },
      key,
      decodeBase64(bundle.data),
    );
    const documentData = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(plain));
    if (!/^[a-f0-9]{40}$/.test(documentData.commit) ||
        !Array.isArray(documentData.files) || documentData.files.length !== 35 ||
        !documentData.files.every(item => sourcePath.test(item.path) && typeof item.text === "string") ||
        new Set(documentData.files.map(item => item.path)).size !== 35) {
      throw new Error("Invalid source list");
    }
    if (token !== attempt) return;
    sources = documentData.files;
    const options = sources.map(source => new Option(source.path));
    files.replaceChildren(...options);
    info.textContent = sources.length + "ファイル ・ コミット " + documentData.commit.slice(0, 12);
    renderFile();
    locked.hidden = true;
    unlocked.hidden = false;
    files.focus();
  } catch {
    if (token === attempt) {
      unlockStatus.textContent = "復号できません。鍵が正しいか確認してください。";
    }
  } finally {
    keyBytes.fill(0);
    if (token === attempt) {
      input.disabled = unlock.disabled = false;
      if (!locked.hidden) input.focus();
    }
  }
});

files.addEventListener("change", renderFile);
next.addEventListener("click", () => {
  files.selectedIndex += 1;
  renderFile();
  if (next.disabled) files.focus();
});

document.getElementById("copy").addEventListener("click", async () => {
  const source = sources[files.selectedIndex];
  try {
    await navigator.clipboard.writeText(source.text);
    if (sources[files.selectedIndex] === source) copyStatus.textContent = "全文をコピーしました。";
  } catch {
    if (sources[files.selectedIndex] !== source) return;
    code.focus();
    code.select();
    copyStatus.textContent = "全文を選択しました。Ctrl+C でコピーしてください。";
  }
});

document.getElementById("clear").addEventListener("click", () => lock());
window.addEventListener("pagehide", () => lock(false));
</script>
</body>
</html>
